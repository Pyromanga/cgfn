name: cgfn-frontier (F14)

# F14 — Fix-it: Training nach Rezept (kcap/pin/both) vs. freies Training.
# Laeuft per Marker-Commit (.trigger/f14) + sonntags 05:00 UTC.
# Run-Log IMMER nach results/ committen (Crash-Diagnose ohne Actions-UI).

on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/f14"

jobs:
  frontier-f14:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run F14 fix experiment
        run: |
          set -o pipefail
          python experiments/f14_fix.py \
            --out results/f14_fix_results.txt 2>&1 | tee results/f14_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F14-Fix-Lauf ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          # Push-Race-Fix (siehe frontier_f11.yml): parallele Workflows
          # pushen beide nach main — rebase + retry statt rot sterben.
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase und erneut"
            git pull --rebase --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen"; exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f14-results
          path: results/
          retention-days: 30
