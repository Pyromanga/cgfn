name: cgfn-frontier (F4/F5/F6)

# F4 (Noise-Robustheit), F5 (kontinuierliche Tasks), F6 (Theorie-Anschluss:
# Sompolinsky-Chaos-Kriterium + Lyapunov-Spektrum vs. Cavity-Referenz).
# Laeuft freitags nachts (CPU-Budget), manuell (workflow_dispatch) UND per
# Marker-Commit: jede Aenderung von .trigger/f4f6 startet den Lauf — so kann
# der "Hausmeister" (oder wer auch immer) den Lauf ohne Actions-UI feuern.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Trainingsschritte (F4/F5)"
        default: "1000"
      train_steps_f6:
        description: "Train-Steps im F6-Modus 'trained'"
        default: "300"
      seeds:
        description: "Seeds"
        default: "0,1"
  push:
    paths:
      - ".trigger/f4f6"

jobs:
  frontier-f4f6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # fuer den Result-Commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run F4 noise experiment
        run: |
          python experiments/f4_noise.py \
            --steps "${{ inputs.steps || '1000' }}" \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --out results/f4_noise_results.txt
      - name: Run F5 continuous experiment
        run: |
          python experiments/f5_continuous.py \
            --steps "${{ inputs.steps || '800' }}" \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --out results/f5_continuous_results.txt
      - name: Run F6 theory experiment
        run: |
          python experiments/f6_spectrum.py \
            --train-steps "${{ inputs.train_steps_f6 || '300' }}" \
            --out results/f6_spectrum_results.txt

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F4F6-Lauf ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          git push
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f4f6-results
          path: results/
          retention-days: 30
