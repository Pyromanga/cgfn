name: cgfn-frontier (T15 Kanten-Skalierungsgesetz, 0.5*sqrt(H))

# T15 — Liegt die Energie-Kante bei der Antriebsnorm 0.5*sqrt(H)? Test bei H=24 und H=96.
# REF unnnormiert je H als Sanity; Normen 2.0/3.5/4.9 exakt normiert. Registrierung in XVII Nachtrag 15.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t15"

jobs:
  frontier-t15:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax-check t15
        run: |
          python -m py_compile experiments/t15_skalierung.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t15 (runpy, schliesst die py_compile-Blindstelle)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t15_skalierung.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T15 Kanten-Skalierung
        run: |
          set -o pipefail
          python experiments/t15_skalierung.py 2>&1 | tee results/t15_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T15-skalierung ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t15-results
          path: results/
          retention-days: 30
