name: cgfn-frontier (T24 Schalter-Richtung v1, L5-Durchlauf-3, maschinengeneriert)

# T24 — SCHALTER-RICHTUNG v1 (Nachtrag 43 / P4-Proposal v1.2,
# Maschine): Kippt JEDE 1-dim-Konjugation (a=1) das Lernen oder
# nur bestimmte Rotationsachsen? 5 Achsen q_seed {2020, 5150,
# 8080, 1111, 4242} je 20 frische Seeds + Control a=0 + Anchor
# HIGH48, 140 Runs. Primaer pqmax (PASS <= 0.15 | KILL >= 0.30).
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t24"

jobs:
  frontier-t24:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax + wrapper-check t24
        run: |
          python -m py_compile contracts/t24.py experiments/t24_schalter_richtung.py tools/lab_kernel.py tools/wrapper_check.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          python tools/wrapper_check.py contracts/t24.py experiments/t24_schalter_richtung.py tools/lab_kernel.py || { echo "[e] MSL-WRAPPER IM SPIEL — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax + wrapper-guard ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t24 (runpy, laedt Kernel + Contract mit)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t24_schalter_richtung.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T24 Schalter-Richtung
        run: |
          set -o pipefail
          python experiments/t24_schalter_richtung.py 2>&1 | tee results/t24_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T24-schalter-richtung ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t24-results
          path: results/
          retention-days: 30
