name: cgfn-frontier (F2/F3)

# F2 (kausaler FTLE-Zwang) + F3 (Plasticity-Loss) — die beiden naechsten
# Frontier-Experimente aus der ROADMAP. Laeuft nachts (CPU-Budget) und manuell;
# Ergebnisse als Artifact unter results/.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Trainingsschritte pro Phase"
        default: "1200"
      seeds:
        description: "Seeds"
        default: "0,1"

jobs:
  frontier-f2f3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # fuer den Result-Commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run F2 regulator experiment
        run: |
          python experiments/f2_regulator.py \
            --steps "${{ inputs.steps || '1200' }}" \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --out results/f2_regulator_results.txt
      - name: Run F3 plasticity experiment
        run: |
          python experiments/f3_plasticity.py \
            --steps "${{ inputs.steps || '1000' }}" \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --frozen-arm \
            --out results/f3_plasticity_results.txt

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F2F3-Lauf ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          git push
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f2f3-results
          path: results/
          retention-days: 30
