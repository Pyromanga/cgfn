name: cgfn-frontier (T20-R2 DM-Treppe, kernel-generiert)

# T20-R2 — die EINE erlaubte Reparatur nach UNENTSCHEIDEN (Nachtrag 31):
# WB als glatter DM-Regler statt Konjugation. Primaer-Mass pfspread220
# (0.4-Schwelle), s50rep mit ZENSIERT-Code -1 (kein Crash durch Zensierung).
# Nach einem weiteren Crash ist die Linie tot.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t20r2"

jobs:
  frontier-t20r2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax + wrapper-check t20r2
        run: |
          python -m py_compile contracts/t20r2.py experiments/t20r2_dm_treppe.py tools/lab_kernel.py tools/wrapper_check.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          python tools/wrapper_check.py contracts/t20r2.py experiments/t20r2_dm_treppe.py tools/lab_kernel.py || { echo "[e] MSL-WRAPPER IM SPIEL — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax + wrapper-guard ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t20r2 (runpy, laedt Kernel + Contract mit)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t20r2_dm_treppe.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T20-R2 DM-Treppe
        run: |
          set -o pipefail
          python experiments/t20r2_dm_treppe.py 2>&1 | tee results/t20r2_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T20r2-dm-treppe ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t20r2-results
          path: results/
          retention-days: 30
