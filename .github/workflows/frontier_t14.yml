name: cgfn-frontier (T14 Mechanismus, Nichtlinearitaet vs Energie-Kante)

# T14 — Mechanismus-Beweis der Energie-Kante: Identity (linear) vs ReLU vs tanh
# bei voller Antriebs-Energie. Kern: lineares RNN darf Paritaet bei keiner Energie loesen.
# Registrierung in XVII Nachtrag 14.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t14"

jobs:
  frontier-t14:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax-check t14
        run: |
          python -m py_compile experiments/t14_mechanismus.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t14 (runpy, schliesst die py_compile-Blindstelle)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t14_mechanismus.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T14 Mechanismus
        run: |
          set -o pipefail
          python experiments/t14_mechanismus.py 2>&1 | tee results/t14_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T14-mechanismus ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t14-results
          path: results/
          retention-days: 30
