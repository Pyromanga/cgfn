name: chess-pattern-miner (C3)

# C3 — Muster-Bergwerk: Regelmining gegen exakte Syzygy-Tablebase-Werte.
# Jonny: "Es gibt nicht unendlich Muster — du muesstes es berechnen koennen."

on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/c3"

jobs:
  chess-pattern-miner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Gate: syntax-check (Kontingent schonen)"
        run: |
          python -m py_compile experiments/c3_pattern_miner.py || { echo "[e] SYNTAX-FEHLER — Abbruch"; exit 1; }
          echo "[i] syntax ok"
      - name: Install python-chess
        run: pip install python-chess
      - name: "Download Syzygy 3-Mann WDL-Tablebases (KBvK.rtbw ist WIRKLICH nur 80 Bytes gross)"
        run: |
          mkdir -p tablebases results
          : > results/c3_run.log
          for t in KQvK KRvK KBvK KNvK KPvK; do
            ok=0
            for url in "http://tablebase.sesse.net/syzygy/3-4-5/$t.rtbw" \
                       "https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl/$t.rtbw"; do
              echo "=== $t <- $url" | tee -a results/c3_run.log
              curl -fsSL --retry 2 --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
                -o "tablebases/$t.rtbw" "$url" 2>&1 | tee -a results/c3_run.log
              rc=${PIPESTATUS[0]}
              sz=$(stat -c%s "tablebases/$t.rtbw" 2>/dev/null || echo 0)
              echo "--- rc=$rc size=$sz" | tee -a results/c3_run.log
              # Achtung: KBvK.rtbw ist ein echter 80-Byte-Syzygy — nur Nicht-Leere verlangen
              if [ "$rc" -eq 0 ] && [ "$sz" -gt 0 ]; then ok=1; break; fi
              rm -f "tablebases/$t.rtbw"
            done
            if [ "$ok" -ne 1 ]; then
              echo "[e] $t: KEIN Mirror lieferte Daten — Abbruch" | tee -a results/c3_run.log
              exit 1
            fi
          done
          echo "[i] alle Tablebases:" | tee -a results/c3_run.log
          ls -la tablebases/ | tee -a results/c3_run.log
      - name: "Sanity-Check: probe_wdl fuer ALLE 5 Klassen (KBvK=80B ist echt, aber probe muss gehen)"
        run: |
          python - <<'EOF'
          import chess, chess.syzygy, random
          tb = chess.syzygy.open_tablebase("tablebases")
          rng = random.Random(0)
          classes = {
              "KQvK": chess.QUEEN,
              "KRvK": chess.ROOK,
              "KBvK": chess.BISHOP,
              "KNvK": chess.KNIGHT,
              "KPvK": chess.PAWN,
          }
          fails = []
          for name, ptype in classes.items():
              good = 0
              for _ in range(200):
                  b = chess.Board(None)
                  wk, bk, p = rng.randrange(64), rng.randrange(64), rng.randrange(64)
                  if max(abs(wk//8-bk//8), abs(wk%8-bk%8)) < 2 or p in (wk, bk):
                      continue
                  b.set_piece_at(wk, chess.Piece(chess.KING, chess.WHITE))
                  b.set_piece_at(bk, chess.Piece(chess.KING, chess.BLACK))
                  b.set_piece_at(p, chess.Piece(ptype, chess.WHITE))
                  if ptype == chess.PAWN and p // 8 in (0, 7):
                      continue
                  b.turn = chess.WHITE
                  try:
                      tb.probe_wdl(b)
                      good += 1
                  except Exception as e:
                      pass
              print(f"[i] {name}-Sanity: {good}/200 Proben ok")
              if good < 1:
                  fails.append(name)
          assert not fails, f"[e] probe_wdl versagt fuer: {fails} — Abbruch"
          print("[i] Sanity ok fuer alle Klassen")
          EOF
      - name: Run C3 pattern miner
        run: |
          set -o pipefail
          python experiments/c3_pattern_miner.py \
            --out results/c3_pattern_mining_results.txt 2>&1 | tee -a results/c3_run.log
      - name: "Gate: Ergebnis darf nicht leer sein"
        run: |
          grep -q "REGEL-BAUM" results/c3_pattern_mining_results.txt \
            || { echo "[e] keine Regelbaeume im Ergebnis — Abbruch statt Fake-Commit"; exit 1; }
      - name: Commit results and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: C3-Muster-Miner ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen"; exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-pattern-miner-results
          path: results/
          retention-days: 30
