name: chess-pattern-miner (C3)

# C3 — Muster-Bergwerk: Regelmining gegen exakte Syzygy-Tablebase-Werte.
# Jonny: "Es gibt nicht unendlich Muster — du muesstes es berechnen koennen."

on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/c3"

jobs:
  chess-pattern-miner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Gate: syntax-check (Kontingent schonen)"
        run: |
          python -m py_compile experiments/c3_pattern_miner.py || { echo "[e] SYNTAX-FEHLER — Abbruch"; exit 1; }
          echo "[i] syntax ok"
      - name: Install python-chess
        run: pip install python-chess
      - name: "Download Syzygy 3-Mann WDL-Tablebases (5 Klassen, Groessenpruefung PRO Mirror)"
        run: |
          mkdir -p tablebases
          for t in KQvK KRvK KBvK KNvK KPvK; do
            ok=0
            for url in "https://tablebase.sesse.net/syzygy/3-4-5/$t.rtbw" \
                       "https://tablebase.lichess.ovh/tables/standard/3-4-5/$t.rtbw"; do
              rm -f "tablebases/$t.rtbw"
              if wget -q -T 30 -t 2 -O "tablebases/$t.rtbw" "$url"; then
                if [ -s "tablebases/$t.rtbw" ]; then
                  ok=1
                  echo "[i] $t.rtbw: $(stat -c%s "tablebases/$t.rtbw") bytes von $url"
                  break
                fi
                echo "[w] $t.rtbw: $url lieferte 200 aber LEERE Datei — naechster Mirror"
              else
                echo "[w] $t.rtbw: wget fehlgeschlagen auf $url"
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "[e] $t.rtbw: KEIN Mirror lieferte Daten — Abbruch"
              exit 1
            fi
          done
          echo "[i] alle Tablebases:"
          ls -la tablebases/
      - name: "Sanity-Check: probe_wdl muss liefern (Run 5 schaufelte 0 Stellungen)"
        run: |
          python - <<'EOF'
          import chess, chess.syzygy, random
          tb = chess.syzygy.open_tablebase("tablebases")
          rng = random.Random(0)
          good = 0
          for _ in range(50):
              b = chess.Board(None)
              wk, bk, q = rng.randrange(64), rng.randrange(64), rng.randrange(64)
              if max(abs(wk//8-bk//8), abs(wk%8-bk%8)) < 2 or q in (wk, bk):
                  continue
              b.set_piece_at(wk, chess.Piece(chess.KING, chess.WHITE))
              b.set_piece_at(bk, chess.Piece(chess.KING, chess.BLACK))
              b.set_piece_at(q, chess.Piece(chess.QUEEN, chess.WHITE))
              b.turn = chess.WHITE
              try:
                  tb.probe_wdl(b)
                  good += 1
              except Exception as e:
                  print("[w] probe fehlgeschlagen:", e)
          print(f"[i] KQvK-Sanity: {good}/50 Proben ok")
          assert good >= 1, "[e] probe_wdl liefert nichts — Tablebase unbrauchbar, Abbruch"
          EOF
      - name: Run C3 pattern miner
        run: |
          set -o pipefail
          python experiments/c3_pattern_miner.py \
            --out results/c3_pattern_mining_results.txt 2>&1 | tee results/c3_run.log
      - name: "Gate: Ergebnis darf nicht leer sein"
        run: |
          grep -q "REGEL-BAUM" results/c3_pattern_mining_results.txt \
            || { echo "[e] keine Regelbaeume im Ergebnis — Abbruch statt Fake-Commit"; exit 1; }
      - name: Commit results and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: C3-Muster-Miner ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen"; exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-pattern-miner-results
          path: results/
          retention-days: 30
