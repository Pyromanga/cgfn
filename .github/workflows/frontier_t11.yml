name: cgfn-frontier (T11 Kanal-Struktur-Zerlegung, Overlap, Traeger, Vorzeichen)

# T11 — Zerlegung des T10-KILL-B: KANAL-OVERLAP (CHANOVLP) vs. KANAL-TRENNUNG (CHANSEP)
# vs. iid VORZEICHEN (ENTROP). REF als Sanity. Registrierung in XVII Nachtrag 11.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t11"

jobs:
  frontier-t11:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax-check t11
        run: |
          python -m py_compile experiments/t11_kanal_struktur.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t11 (runpy, schliesst die py_compile-Blindstelle)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t11_kanal_struktur.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T11 Kanal-Struktur-Zerlegung
        run: |
          set -o pipefail
          python experiments/t11_kanal_struktur.py 2>&1 | tee results/t11_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T11-kanal-struktur ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t11-results
          path: results/
          retention-days: 30
