name: cgfn-scaling (F1)

# F1 (ROADMAP): Verschiebt sich der Criticality-Sweet-Spot mit hidden_dim?
# Laeuft nachts (kleines CPU-Budget) und manuell; Ergebnisse als Artifact.

on:
  workflow_dispatch:
    inputs:
      dims:
        description: "hidden_dim-Grid"
        default: "16,32,64,128"
      taus:
        description: "tau-Grid"
        default: "0.5,1.0,2.0,4.0"
      steps:
        description: "Trainingsschritte pro Run"
        default: "1500"
  schedule:
    - cron: "0 3 * * 1"  # montags 03:00 UTC

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run scaling experiment (F1)
        run: |
          python experiments/scaling.py \
            --dims "${{ inputs.dims || '16,32,64,128' }}" \
            --taus "${{ inputs.taus || '0.5,1.0,2.0,4.0' }}" \
            --steps "${{ inputs.steps || '1500' }}" \
            --out results/scaling_results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaling-results
          path: results/scaling_results.txt
          retention-days: 30
