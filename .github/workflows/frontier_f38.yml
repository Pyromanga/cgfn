name: cgfn-frontier (F38 Erosions-Anatomie)

# F38 — greift der Optimierer GERICHTET an? Modale Anatomie der F27-kappa_T-Erosion.
# Registriertes PASS/KILL; Kontrast-Arme SGD/Momentum ohne Schwelle.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/f38"

jobs:
  frontier-f38:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax-check f38
        run: |
          python -m py_compile experiments/f38_erosion_anatomy.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run F38 Erosions-Anatomie
        run: |
          set -o pipefail
          python experiments/f38_erosion_anatomy.py 2>&1 | tee results/f38_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F38-erosion-anatomy ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f38-results
          path: results/
          retention-days: 30
