name: cgfn-frontier (T25 Ordnungsparameter v1, L5-Durchlauf-4, maschinengeneriert)

# T25 — ORDNUNGSPARAMETER v1 (Nachtrag 45 / P4-Proposal v1.3,
# Maschine): Ist der DM-Kollaps (T20: 13.21 -> 1.40) ein
# Ordnungsparameter des Schalters? Stufen a {0,1,4,24} je 1
# frischer 20er-Block + Anchor HIGH48, 100 Runs. Primaer dmeff
# (Doppelklausel 5.0 + 3*SE): PASS >= 5.0 | KILL < 5.0.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t25"

jobs:
  frontier-t25:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax + wrapper-check t25
        run: |
          python -m py_compile contracts/t25.py experiments/t25_ordnungsparameter.py tools/lab_kernel.py tools/wrapper_check.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          python tools/wrapper_check.py contracts/t25.py experiments/t25_ordnungsparameter.py tools/lab_kernel.py || { echo "[e] MSL-WRAPPER IM SPIEL — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax + wrapper-guard ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t25 (runpy, laedt Kernel + Contract mit)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t25_ordnungsparameter.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T25 Ordnungsparameter
        run: |
          set -o pipefail
          python experiments/t25_ordnungsparameter.py 2>&1 | tee results/t25_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T25-ordnung-parameter ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t25-results
          path: results/
          retention-days: 30
