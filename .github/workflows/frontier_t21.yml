name: cgfn-frontier (T21 Delle-Statistik, kernel-generiert)

# T21 — DELLE-STATISTIK (Nachtrag 33): Ist die s50-Delle bei H=48 real
# oder Seed-Rauschen? Frischer Seed-Block 210..309 (100, disjunkt).
# Primaer-Mass d183 = P_lernt(48,1.83) - P_lernt(24,1.83), Schwelle 0.15.
# SEKUNDAER s50rep mit ZENSIERT-Code -1 (kein Crash durch Zensierung).
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t21"

jobs:
  frontier-t21:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax + wrapper-check t21
        run: |
          python -m py_compile contracts/t21.py experiments/t21_delle_statistik.py tools/lab_kernel.py tools/wrapper_check.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          python tools/wrapper_check.py contracts/t21.py experiments/t21_delle_statistik.py tools/lab_kernel.py || { echo "[e] MSL-WRAPPER IM SPIEL — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax + wrapper-guard ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t21 (runpy, laedt Kernel + Contract mit)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t21_delle_statistik.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T21 Delle-Statistik
        run: |
          set -o pipefail
          python experiments/t21_delle_statistik.py 2>&1 | tee results/t21_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: T21-delle-statistik ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t21-results
          path: results/
          retention-days: 30
