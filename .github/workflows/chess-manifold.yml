name: chess-manifold

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profil: smoke (~300 Stellungen) oder full (~10k)'
        required: false
        default: 'smoke'
        type: choice
        options: ['smoke', 'full']
  push:
    paths:
      - ".trigger/chess-manifold"
      - "chess-manifold/**"
      - ".github/workflows/chess-manifold.yml"

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: chess-manifold
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stockfish installieren (apt, best-effort; Fallback im Code)
        run: |
          set -x
          sudo apt-get update -qq 2>&1 | tee -a apt.log || true
          sudo apt-cache policy stockfish 2>&1 | tee -a apt.log || true
          sudo apt-get install -y -qq --no-install-recommends stockfish 2>&1 | tee -a apt.log || echo "WARN: apt stockfish fehlgeschlagen, Code-Fallback wird genutzt" | tee -a apt.log
          command -v stockfish 2>&1 | tee -a apt.log || true

      - name: Abhaengigkeiten
        run: |
          set -x
          python -m pip install --upgrade pip 2>&1 | tee -a dep.log || true
          if ! pip install torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee -a dep.log; then
            echo "WARN: torch CPU-Index fehlgeschlagen, PyPI-Fallback" | tee -a dep.log
            pip install torch 2>&1 | tee -a dep.log || true
          fi
          pip install -r requirements.txt 2>&1 | tee -a dep.log || true
          pip install -e . 2>&1 | tee -a dep.log || true
          pip check 2>&1 | tee -a dep.log || true
          python -c "import chess, ripser, torch, pytorch_lightning; print('imports ok', torch.__version__)" 2>&1 | tee -a dep.log || true

      - name: Tests
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest.log

      - name: Pipeline
        run: |
          set -o pipefail
          PROFILE="${{ inputs.profile }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            PROFILE="$(cat ../.trigger/chess-manifold 2>/dev/null | tr -d '[:space:]' || echo smoke)"
          fi
          echo "Profil: $PROFILE"
          if [ -z "$PROFILE" ] || [ "$PROFILE" = "smoke" ]; then
            make smoke 2>&1 | tee pipeline.log
          else
            make full 2>&1 | tee pipeline.log
          fi

      - name: Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-manifold-results-${{ github.run_number }}
          path: |
            chess-manifold/results/
            chess-manifold/data/*.csv
            chess-manifold/apt.log
            chess-manifold/dep.log
            chess-manifold/pytest.log
            chess-manifold/pipeline.log
          retention-days: 30

      - name: Ergebnisse zurueckcommitten
        if: success()
        run: |
          git config user.name "chess-manifold-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "Keine Ergebnis-Aenderungen."
          else
            git commit -m "chess-manifold: results run #${{ github.run_number }} [skip ci]"
            git push
          fi

      - name: Fehler-Diagnose (Logs -> Issue #2)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Run #${{ github.run_number }} (${{ github.sha }}) fehlgeschlagen. Job-Status: ${{ job.status }}"
            echo
            for f in apt.log dep.log pytest.log pipeline.log; do
              if [ -f "$f" ]; then
                echo "===== tail -80 $f ====="
                tail -n 80 "$f"
                echo
              fi
            done
            echo "===== gh run view --log-failed (Fallback) ====="
            gh run view ${{ github.run_id }} --log-failed 2>&1 | tail -n 120 || true
          } > diag.txt
          gh api -X POST repos/Pyromanga/cgfn/issues/2/comments -F body=@diag.txt || echo "Kommentar-Post fehlgeschlagen"
