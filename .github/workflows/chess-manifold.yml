name: chess-manifold

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profil: smoke (~300 Stellungen) oder full (~10k)'
        required: false
        default: 'smoke'
        type: choice
        options: ['smoke', 'full']
  push:
    paths:
      - ".trigger/chess-manifold"
      - "chess-manifold/**"
      - ".github/workflows/chess-manifold.yml"

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: chess-manifold
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stockfish installieren (apt, best-effort; Fallback im Code)
        run: |
          set -x
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends stockfish || echo "WARN: apt stockfish fehlgeschlagen, Code-Fallback wird genutzt"
          command -v stockfish || true

      - name: Abhaengigkeiten
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .
          pip check || true

      - name: Tests
        run: python -m pytest tests -q

      - name: Pipeline
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ -z "${{ inputs.profile }}" ] || [ "${{ inputs.profile }}" = "smoke" ]; then
            make smoke
          else
            make full
          fi

      - name: Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-manifold-results-${{ github.run_number }}
          path: |
            chess-manifold/results/
            chess-manifold/data/*.csv
          retention-days: 30

      - name: Ergebnisse zurueckcommitten
        if: success()
        run: |
          git config user.name "chess-manifold-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "Keine Ergebnis-Aenderungen."
          else
            git commit -m "chess-manifold: results run #${{ github.run_number }} [skip ci]"
            git push
          fi

      - name: Fehler-Diagnose (Job-Log -> Issue #2)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          RUN_ID=${{ github.run_id }}
          JOB_ID=$(gh api repos/Pyromanga/cgfn/actions/runs/$RUN_ID/jobs --jq '.jobs[0].id' 2>/dev/null || echo "")
          {
            echo "Run #${{ github.run_number }} (${{ github.sha }}) fehlgeschlagen."
            echo
            if [ -n "$JOB_ID" ]; then
              gh api repos/Pyromanga/cgfn/actions/jobs/$JOB_ID/logs 2>&1 | tail -n 150
            else
              echo "Job-ID nicht ermittelbar."
            fi
          } > diag.txt || true
          gh api -X POST repos/Pyromanga/cgfn/issues/2/comments -F body=@diag.txt || echo "Kommentar-Post fehlgeschlagen"
