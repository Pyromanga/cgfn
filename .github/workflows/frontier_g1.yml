name: cgfn-frontier (G1 Kontroll-Autoritaet)

# G1 — kann man den Lyapunov-Exponenten ueberhaupt tunen?
# Kontroll-Audit: normal vs designed-nn vs Feld-Standard-ESN. Registriert.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/g1"

jobs:
  frontier-g1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax-check g1 + f34-Instrument
        run: |
          python -m py_compile experiments/g1_control_authority.py experiments/f34_exploration.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run G1 Kontroll-Autoritaet
        run: |
          set -o pipefail
          python experiments/g1_control_authority.py 2>&1 | tee results/g1_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: G1-control-authority ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-g1-results
          path: results/
          retention-days: 30
