name: cgfn-frontier (T16 2D-Karte H x s, kernel-generiert)

# T16 — Erster kernel-generierter Stein: Wie verschiebt sich die Lernbarkeits-
# Rampe mit H? Contract contracts/t16.py, Instrument experiments/t16_2d_karte.py,
# Verdikt generiert vom W1-Kernel. Registrierung: XVII Nachtrag 22.
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/t16"

jobs:
  frontier-t16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax + wrapper-check t16
        run: |
          python -m py_compile contracts/t16.py experiments/t16_2d_karte.py tools/lab_kernel.py tools/wrapper_check.py || { echo "[e] SYNTAX-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          python tools/wrapper_check.py contracts/t16.py experiments/t16_2d_karte.py tools/lab_kernel.py || { echo "[e] MSL-WRAPPER IM SPIEL — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax + wrapper-guard ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Gate import-check t16 (runpy, laedt Kernel + Contract mit)
        run: |
          python -c "import runpy; runpy.run_path('experiments/t16_2d_karte.py', run_name='not_main')" || { echo "[e] IMPORT/LOAD-FEHLER — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] import ok"
      - name: Run T16 2D-Karte
        run: |
          set -o pipefail
          python experiments/t16_2d_karte.py 2>&1 | tee results/t16_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit." ; exit 0; fi
          git commit -m "results: T16-2d-karte ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-t16-results
          path: results/
          retention-days: 30
