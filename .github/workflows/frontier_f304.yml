name: cgfn-frontier (F30.4)

# F30.4 — Transfer-Kill-Test: F30.3-Generalisierung (H=256 + NARMA-10).
# Teurer als F30.3 wegen H=256-Benettin (~15-40 Min).
on:
  workflow_dispatch:
  push:
    paths:
      - ".trigger/f304"

jobs:
  frontier-f304:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate syntax-check f304
        run: |
          python -m py_compile experiments/f304_transfer.py || { echo "[e] SYNTAX-FEHLER in experiments/f304_transfer.py — Abbruch, Kontingent geschont"; exit 1; }
          echo "[i] syntax ok"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run F30.4
        run: |
          set -o pipefail
          python experiments/f304_transfer.py \
            --out results/f304_transfer_results.txt 2>&1 | tee results/f304_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F30.4-transfer ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase (autostash) und erneut"
            git pull --rebase --autostash --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen" && exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f304-results
          path: results/
          retention-days: 30
