name: cgfn-frontier (F7)

# F7 — Spectral Ruler: Drei Chaos-Regeln aus der Gewichtsmatrix
# (Mean-Field / Eigenwert / Singulärwert) gegen gemessenes SVD-FTLE.
# Laeuft samstags nachts (CPU-Budget), manuell (workflow_dispatch) UND per
# Marker-Commit (.trigger/f7) — Hausmeister-Trigger ohne Actions-UI.

on:
  workflow_dispatch:
    inputs:
      train_steps:
        description: "Train-Steps im Modus 'trained'"
        default: "300"
      seeds:
        description: "Seeds"
        default: "0,1,2"
  push:
    paths:
      - ".trigger/f7"
  schedule:
    - cron: "0 3 * * 6"  # samstags 03:00 UTC

jobs:
  frontier-f7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # fuer den Result-Commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run F7 spectral ruler experiment
        run: |
          python experiments/f7_spectral.py \
            --train-steps "${{ inputs.train_steps || '300' }}" \
            --seeds "${{ inputs.seeds || '0,1,2' }}" \
            --out results/f7_spectral_results.txt
      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F7-Spectral-Ruler-Lauf ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          git push
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f7-results
          path: results/
          retention-days: 30
