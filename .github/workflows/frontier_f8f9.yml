name: cgfn-frontier (F8/F9)

# F8 — Spectral Ruler als Diagnose-Tool (Checkpoint-Sweep, Regel-Guete MF/Eig/SV)
# F9 — Generatives Pendant: Designed W, Vorhersage-gegen-Messung.
# Laeuft sonntags nachts (CPU-Budget) UND per Marker-Commit (.trigger/f8f9).
# Run-Logs werden IMMER nach results/ committet (auch bei Crash) —
# Diagnose-Kanal ohne Actions-UI (Lesson aus wildgrove Issue #5).

on:
  workflow_dispatch:
    inputs:
      train_steps:
        description: "Train-Steps (F9) / Total-Steps (F8)"
        default: "400"
      seeds:
        description: "Seeds"
        default: "0,1"
  push:
    paths:
      - ".trigger/f8f9"

jobs:
  frontier-f8f9:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # fuer den Result-Commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run F8 ruler application experiment
        run: |
          set -o pipefail
          python experiments/f8_ruler.py \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --total-steps "${{ inputs.train_steps || '600' }}" \
            --out results/f8_ruler_results.txt 2>&1 | tee results/f8_run.log
      - name: Run F9 designed-network experiment
        run: |
          set -o pipefail
          python experiments/f9_design.py \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --train-steps "${{ inputs.train_steps || '400' }}" \
            --out results/f9_design_results.txt 2>&1 | tee results/f9_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F8/F9-Ruler-Lauf ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          git push
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f8f9-results
          path: results/
          retention-days: 30
