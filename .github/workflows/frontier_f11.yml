name: cgfn-frontier (F11)

# F11 — Messplatz-Validierung: SVD-FTLE vs. Benettin-QR + Stabilitaets-Audit.
# Laeuft per Marker-Commit (.trigger/f11) + dienstags 03:00 UTC.
# Run-Log IMMER nach results/ committen (Crash-Diagnose ohne Actions-UI).

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds"
        default: "0,1"
      train_steps:
        description: "Train-Steps (trainierte Netze)"
        default: "300"
  push:
    paths:
      - ".trigger/f11"
  schedule:
    - cron: "0 3 * * 2"  # dienstags 03:00 UTC

jobs:
  frontier-f11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Run F11 measurement-validation experiment
        run: |
          set -o pipefail
          python experiments/f11_benettin.py \
            --seeds "${{ inputs.seeds || '0,1' }}" \
            --train-steps "${{ inputs.train_steps || '300' }}" \
            --out results/f11_benettin_results.txt 2>&1 | tee results/f11_run.log
      - name: Commit results and logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[i] keine neuen Ergebnisse — kein Commit."; exit 0; fi
          git commit -m "results: F11-Benettin-Lauf ${GITHUB_RUN_NUMBER} ($(date -u '+%F %H:%M') UTC)"
          # FIX (2026-10-13, Push-Race debug<>f11): Parallele Workflows (z.B.
          # debug + f11 im selben Trigger-Commit) pushen beide nach main — der
          # zweite push wurde als non-fast-forward rejected und der Job lief
          # ROT, obwohl das Experiment erfolgreich war. Rebase + Retry:
          for i in 1 2 3 4 5; do
            if git push; then echo "[i] push ok (Versuch $i)"; exit 0; fi
            echo "[w] push fehlgeschlagen (Versuch $i) — rebase und erneut"
            git pull --rebase --no-edit || { echo "[e] rebase fehlgeschlagen"; exit 1; }
            sleep $((i * 10))
          done
          echo "[e] push nach 5 Versuchen fehlgeschlagen"; exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-f11-results
          path: results/
          retention-days: 30
